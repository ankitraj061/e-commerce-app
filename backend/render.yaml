# render.yaml — Render deployment config for the Express backend
# Docs: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: vaultiq-backend
    runtime: node
    rootDir: backend          # relative to repo root
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
      # Add the rest of these in the Render dashboard (never commit secrets):
      # DATABASE_URL, UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN,
      # ACCESS_TOKEN_SECRET, REFRESH_TOKEN_SECRET, RAZORPAY_KEY_ID,
      # RAZORPAY_KEY_SECRET, ALLOWED_ORIGINS
    healthCheckPath: /health
